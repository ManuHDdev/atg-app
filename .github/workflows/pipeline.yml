name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/manuhddev/atg

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build backend + push Docker (matrix x7)
  # Build always (verifica PRs); Docker solo en push a main
  # ──────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, socios, petroleras, tarjetas, contratos, creditos, dispositivos]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: |
          chmod +x backend/${{ matrix.service }}/mvnw
          cd backend/${{ matrix.service }}
          ./mvnw clean package -DskipTests -B

      - name: Rename JAR
        run: |
          JAR=$(find backend/${{ matrix.service }}/target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -1)
          if [[ -z "$JAR" ]]; then
            echo "ERROR: No JAR found in backend/${{ matrix.service }}/target/"
            ls backend/${{ matrix.service }}/target/ || true
            exit 1
          fi
          cp "$JAR" backend/${{ matrix.service }}/app.jar
          echo "JAR copiado: $JAR → app.jar"

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ──────────────────────────────────────────────
  # JOB 2: Build frontend + push Docker
  # Build siempre (verifica PRs); Docker solo en push a main
  # ──────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Build Angular
        run: cd frontend && npx ng build --base-href /atg/ --configuration=production

      - name: Copy nginx config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp nginx/nginx-ssl.conf frontend/nginx.conf

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ──────────────────────────────────────────────
  # JOB 3: Deploy to production server
  # Only on push to main
  # ──────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images on runner
        run: |
          for svc in auth socios petroleras tarjetas contratos creditos dispositivos frontend; do
            docker pull ${{ env.IMAGE_PREFIX }}-${svc}:latest
          done

      - name: Transfer images to server
        run: |
          docker save \
            ${{ env.IMAGE_PREFIX }}-auth:latest \
            ${{ env.IMAGE_PREFIX }}-socios:latest \
            ${{ env.IMAGE_PREFIX }}-petroleras:latest \
            ${{ env.IMAGE_PREFIX }}-tarjetas:latest \
            ${{ env.IMAGE_PREFIX }}-contratos:latest \
            ${{ env.IMAGE_PREFIX }}-creditos:latest \
            ${{ env.IMAGE_PREFIX }}-dispositivos:latest \
            ${{ env.IMAGE_PREFIX }}-frontend:latest \
          | gzip \
          | ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'gunzip | docker load'

      - name: Copy compose and config files
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'mkdir -p ~/atg-app/keycloak ~/atg-app/backend/sql'
          scp -P ${{ secrets.SSH_PORT }} \
            infra/docker-compose.prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/atg-app/docker-compose.prod.yml
          scp -P ${{ secrets.SSH_PORT }} -r \
            keycloak/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/atg-app/keycloak/
          scp -P ${{ secrets.SSH_PORT }} \
            backend/sql/docker-init.sql \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/atg-app/backend/sql/docker-init.sql

      - name: Deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ~/atg-app
            # Bajar stack viejo si sigue corriendo con el compose de desarrollo
            if docker compose -f docker-compose.yml ps -q 2>/dev/null | grep -q .; then
              docker compose -f docker-compose.yml down
            fi
            docker compose -f docker-compose.prod.yml up -d
          ENDSSH
