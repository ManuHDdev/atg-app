name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/manuhddev/atg

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build backend JARs (matrix x7)
  # ──────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, socios, petroleras, tarjetas, contratos, creditos, dispositivos]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: |
          chmod +x backend/${{ matrix.service }}/mvnw
          cd backend/${{ matrix.service }}
          ./mvnw clean package -DskipTests -B

      - name: Rename JAR
        run: |
          JAR=$(ls backend/${{ matrix.service }}/target/*.jar | grep -v original | head -1)
          cp "$JAR" backend/${{ matrix.service }}/app.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: backend/${{ matrix.service }}/app.jar
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 2: Build frontend
  # ──────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Angular
        run: cd frontend && npx ng build --base-href /atg/ --configuration=production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser/
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 3: Build & push Docker images (matrix x8)
  # Only on push to main
  # ──────────────────────────────────────────────
  docker-build-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            artifact: jar-auth
            context: backend/auth
          - service: socios
            artifact: jar-socios
            context: backend/socios
          - service: petroleras
            artifact: jar-petroleras
            context: backend/petroleras
          - service: tarjetas
            artifact: jar-tarjetas
            context: backend/tarjetas
          - service: contratos
            artifact: jar-contratos
            context: backend/contratos
          - service: creditos
            artifact: jar-creditos
            context: backend/creditos
          - service: dispositivos
            artifact: jar-dispositivos
            context: backend/dispositivos
          - service: frontend
            artifact: frontend-dist
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.context }}

      - name: Copy nginx config (frontend only)
        if: matrix.service == 'frontend'
        run: cp nginx/nginx-ssl.conf frontend/nginx.conf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ──────────────────────────────────────────────
  # JOB 4: Deploy to production server
  # Only on push to main
  # ──────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build-push]
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images on runner
        run: |
          for svc in auth socios petroleras tarjetas contratos creditos dispositivos frontend; do
            docker pull ${{ env.IMAGE_PREFIX }}-${svc}:latest
          done

      - name: Transfer images to server
        run: |
          docker save \
            ${{ env.IMAGE_PREFIX }}-auth:latest \
            ${{ env.IMAGE_PREFIX }}-socios:latest \
            ${{ env.IMAGE_PREFIX }}-petroleras:latest \
            ${{ env.IMAGE_PREFIX }}-tarjetas:latest \
            ${{ env.IMAGE_PREFIX }}-contratos:latest \
            ${{ env.IMAGE_PREFIX }}-creditos:latest \
            ${{ env.IMAGE_PREFIX }}-dispositivos:latest \
            ${{ env.IMAGE_PREFIX }}-frontend:latest \
          | gzip \
          | ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'gunzip | docker load'

      - name: Copy compose and config files
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'mkdir -p ~/atg-app/keycloak'
          scp -P ${{ secrets.SSH_PORT }} \
            infra/docker-compose.prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/atg-app/docker-compose.prod.yml
          scp -P ${{ secrets.SSH_PORT }} -r \
            keycloak/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/atg-app/keycloak/

      - name: Deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ~/atg-app && docker compose -f docker-compose.prod.yml up -d'
