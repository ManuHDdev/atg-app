# Config nginx propia de la imagen atg-frontend — SOLO sirve la app de ATG.
# En producción, esta imagen se ejecuta con /etc/nginx/conf.d montado desde
# /home/manu/nginx-shared/conf.d/ (ver infra/docker-compose.prod.yml), que
# sobrescribe este archivo con el enrutamiento real de manuhd.duckdns.org y
# los demás dominios compartidos. Este archivo solo aplica si la imagen se
# ejecuta suelta (p. ej. para pruebas locales), y por eso es deliberadamente
# mínimo: no debe volver a contener rutas de otros proyectos.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 301 /atg/;
    }

    location = /atg {
        return 301 /atg/;
    }

    location /atg/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /atg/index.html;
    }
}
