@if (isOpen) {
  <div class="modal-overlay" (click)="cerrar()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ titulo }}</h2>
        <button class="btn-close" (click)="cerrar()"><i class="bi bi-x-lg"></i></button>
      </div>

      <div class="modal-body">
        @if (!pdfPreviewUrl) {
          <div class="loading">
            <div class="spinner"></div>
            <p>Cargando PDF...</p>
          </div>
        }

        @if (pdfPreviewUrl) {
          <div class="pdf-viewer-container">
            <embed
              [src]="pdfPreviewUrl"
              type="application/pdf"
              class="pdf-viewer"
            />
          </div>
        }
      </div>

      <div class="modal-footer">
        @if (mostrarBotonDescargar) {
          <button
            class="btn-secondary"
            (click)="descargarPdf()"
            [disabled]="!pdfPreviewUrl"
            [attr.aria-disabled]="!pdfPreviewUrl ? 'true' : null"
            [attr.aria-describedby]="!pdfPreviewUrl ? 'descargar-pdf-motivo' : null"
            [attr.title]="!pdfPreviewUrl ? 'El documento todavía se está cargando.' : null"
          >
            <i class="bi bi-download" aria-hidden="true"></i> Descargar PDF
          </button>
          @if (!pdfPreviewUrl) {
            <span id="descargar-pdf-motivo" class="sr-only">
              No se puede descargar todavía: el documento aún se está cargando.
            </span>
          }
        }
        <button class="btn-primary" (click)="cerrar()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
}
