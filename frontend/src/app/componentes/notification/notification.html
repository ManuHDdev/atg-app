<div class="notification-container" role="status" aria-live="polite" aria-atomic="false">
  @for (notification of notifications; track notification.id) {
    <div class="notification notification-{{notification.type}}" (click)="removeNotification(notification.id)">
      <span class="notification-icon"><i class="bi" [class]="getIconClass(notification.type)" aria-hidden="true"></i></span>
      <span class="notification-message"><span class="sr-only">{{ getTypeLabel(notification.type) }}: </span>{{ notification.message }}</span>
      <button type="button" class="notification-close" aria-label="Cerrar notificación" (click)="removeNotification(notification.id)">×</button>
    </div>
  }
</div>
