<div class="app-container">
  <!-- Panel lateral -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a routerLink="inicio">
        <img src="assets/imagenes/ATG.png" alt="">
      </a>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" (click)="navegarA('dispositivos')">
        <i class="bi bi-cpu sidebar-icon"></i>
        <span>Dispositivos</span>
      </a>
      <a class="sidebar-link" (click)="navegarA('solicitudes-tarjetas/dashboard')">
        <i class="bi bi-credit-card-2-front sidebar-icon"></i>
        <span>Solicitudes de Tarjetas</span>
      </a>
      <a class="sidebar-link" (click)="navegarA('contratos')">
        <i class="bi bi-file-earmark-text sidebar-icon"></i>
        <span>Contratos</span>
      </a>
      <a class="sidebar-link" (click)="navegarA('creditos')">
        <i class="bi bi-coin sidebar-icon"></i>
        <span>Créditos</span>
      </a>
      <a class="sidebar-link" (click)="navegarA('socios')">
        <i class="bi bi-people sidebar-icon"></i>
        <span>Socios</span>
      </a>
      <a class="sidebar-link" (click)="navegarA('empresas')">
        <i class="bi bi-buildings sidebar-icon"></i>
        <span>Empresas</span>
      </a>
      <a class="sidebar-link" (click)="navegarA('petroleras')">
        <i class="bi bi-fuel-pump sidebar-icon"></i>
        <span>Petroleras</span>
      </a>

      @if (auth.isAdmin() || auth.isDeveloper()) {
        <div class="sidebar-divider"></div>
        @if (auth.isAdmin()) {
          <a class="sidebar-link sidebar-link-admin" (click)="navegarA('usuarios')">
            <i class="bi bi-shield-lock sidebar-icon"></i>
            <span>Gestión de Usuarios</span>
          </a>
        }
        <a class="sidebar-link sidebar-link-admin" (click)="navegarA('incidencias')">
          <i class="bi bi-bug sidebar-icon"></i>
          <span>Incidencias</span>
        </a>
      }
    </nav>

    @if (auth.isAuthenticated()) {
      <div class="sidebar-user">
        <div class="sidebar-user-info">
          <i class="bi bi-person-circle"></i>
          <span class="sidebar-user-name">{{ auth.getUserFullName() }}</span>
        </div>
        <button class="sidebar-logout" (click)="auth.logout()" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    }
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Componente de notificaciones -->
<app-notification></app-notification>
