# Configuración HTTP-only inicial
# Usar este archivo ANTES de obtener el certificado SSL con Let's Encrypt
# Después de obtener el cert, ejecutar: ./deploy/enable-ssl.sh

server {
    listen 80;
    server_name manuhd.duckdns.org;

    # Challenge de Certbot para verificación del dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir raíz a /atg/
    location = / {
        return 301 /atg/;
    }

    location = /atg {
        return 301 /atg/;
    }

    # Servir Angular SPA bajo /atg/ (acceso temporal sin HTTPS)
    location /atg/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /atg/index.html;
    }
}
