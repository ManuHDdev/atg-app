# Configuración HTTPS definitiva con Let's Encrypt
# Este archivo reemplaza nginx.conf después de obtener el certificado SSL
# Para activarlo: ./deploy/enable-ssl.sh

# Redirigir HTTP -> HTTPS y manejar challenge de Certbot (ambos dominios)
server {
    listen 80;
    server_name manuhd.duckdns.org muebleshorrillo.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl;
    http2 on;
    server_name manuhd.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/manuhd.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manuhd.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Archivos estáticos de Angular
    root /usr/share/nginx/html;
    index index.html;

    # Límite de subida de archivos (para PDFs y plantillas en contratos)
    client_max_body_size 50M;

    # Resolver de Docker para resolución DNS dinámica (evita fallos al reiniciar)
    resolver 127.0.0.11 valid=10s;

    # ---- Proxy hacia microservicios ----
    # Usar variables en proxy_pass para diferir resolución DNS al momento de la petición

    location /auth/api/ {
        set $svc_auth http://auth:8080;
        rewrite ^/auth/api/(.*) /api/$1 break;
        proxy_pass $svc_auth;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socios/api/ {
        set $svc_socios http://socios:8080;
        rewrite ^/socios/api/(.*) /api/$1 break;
        proxy_pass $svc_socios;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /petroleras/api/ {
        set $svc_petroleras http://petroleras:8080;
        rewrite ^/petroleras/api/(.*) /api/$1 break;
        proxy_pass $svc_petroleras;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tarjetas/api/ {
        set $svc_tarjetas http://tarjetas:8080;
        rewrite ^/tarjetas/api/(.*) /api/$1 break;
        proxy_pass $svc_tarjetas;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /contratos/api/ {
        set $svc_contratos http://contratos:8080;
        rewrite ^/contratos/api/(.*) /api/$1 break;
        proxy_pass $svc_contratos;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /creditos/api/ {
        set $svc_creditos http://creditos:8080;
        rewrite ^/creditos/api/(.*) /api/$1 break;
        proxy_pass $svc_creditos;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dispositivos/api/ {
        set $svc_dispositivos http://dispositivos:8080;
        rewrite ^/dispositivos/api/(.*) /api/$1 break;
        proxy_pass $svc_dispositivos;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak - Identity Provider
    location /keycloak/ {
        set $svc_keycloak http://keycloak:8080;
        proxy_pass $svc_keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Mailhog - UI web para ver emails (solo testing)
    location = /mail {
        return 301 /mail/;
    }

    location /mail/ {
        set $svc_mailhog http://mailhog:8025;
        proxy_pass $svc_mailhog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket para actualizaciones en tiempo real
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Redirigir raíz a /atg/
    location = / {
        return 301 /atg/;
    }

    location = /atg {
        return 301 /atg/;
    }

    # Angular SPA bajo /atg/
    location /atg/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /atg/index.html;
    }
}

# ─── muebleshorrillo.duckdns.org ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name muebleshorrillo.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/muebleshorrillo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muebleshorrillo.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_muebles:10m;

    client_max_body_size 20M;
    resolver 127.0.0.11 valid=10s;

    # Keycloak del proyecto muebles
    location /keycloak/ {
        set $svc_kc http://muebles-keycloak:8080;
        proxy_pass $svc_kc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # API del proyecto muebles (muebles-auth actúa como gateway)
    location /api/ {
        set $svc_auth http://muebles-auth:8080;
        proxy_pass $svc_auth;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Angular de muebles (SPA)
    location / {
        set $svc_frontend http://muebles-frontend:80;
        proxy_pass $svc_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
