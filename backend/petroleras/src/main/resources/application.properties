# Configuración del servidor
server.port=8082

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/atg?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=admin_contratos
spring.datasource.password=ContratosDev2024!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de archivos (50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Almacenamiento de plantillas
app.storage.plantillas-path=storage/plantillas

# CORS
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Keycloak JWT
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/keycloak/realms/${KEYCLOAK_REALM:atg}/protocol/openid-connect/certs
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/keycloak/realms/atg}
keycloak.realm=${KEYCLOAK_REALM:atg}
