spring.application.name=contratos-test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://test.local/fake-certs
keycloak.issuer-uri=http://test.local/keycloak/realms/atg

microservices.petroleras.url=http://localhost:8082
microservices.socios.url=http://localhost:8081

app.email.enabled=false
spring.mail.host=localhost
spring.mail.port=1025

logging.level.com.manuhd.app.contratos=WARN
logging.level.org.springframework=WARN
