# Test Configuration
spring.application.name=contratos-test

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Storage (Test directories)
file.storage.plantillas=./test-storage/plantillas/originales
file.storage.contratos=./test-storage/contratos/solicitudes
file.storage.borradores=./test-storage/contratos/borradores

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Email (Always disabled for tests)
email.enabled=false
email.from=test@contratos.com

# Microservices URLs (Mock)
microservice.petroleras.url=http://localhost:8082
microservice.socios.url=http://localhost:8081

# Logging
logging.level.com.manuhd.app.contratos=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
