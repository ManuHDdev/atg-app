spring.application.name=tarjetas-test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://test.local/fake-certs
keycloak.issuer-uri=http://test.local/keycloak/realms/atg

logging.level.com.manuhd.app.tarjetas=WARN
logging.level.org.springframework=WARN
