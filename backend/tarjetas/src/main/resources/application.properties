# Configuración del servidor
server.port=8083

# Configuración de MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Configuración de archivos (50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Configuración de correo electrónico (SMTP)
# Local: arrancar Mailhog con: docker run -d -p 1025:1025 -p 8025:8025 mailhog/mailhog
# UI de emails en: http://localhost:8025
app.email.enabled=true
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=notificaciones@atg.es
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# URL del microservicio socios
app.socios.url=http://localhost:8081

# URL del microservicio petroleras (plantillas de documento del circuito de firma)
microservices.petroleras.url=http://localhost:8082

# Directorio raíz de los PDFs de las solicitudes de tarjeta (uno por número de solicitud)
storage.tarjetas=./storage/tarjetas/solicitudes

# Keycloak JWT
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/keycloak/realms/${KEYCLOAK_REALM:atg}/protocol/openid-connect/certs
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/keycloak/realms/atg}
keycloak.realm=${KEYCLOAK_REALM:atg}
