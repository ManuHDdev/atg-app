spring.application.name=auth
server.port=8080

# CORS
spring.web.cors.allowed-origins=http://localhost:4200

# MySQL / JPA
spring.datasource.url=jdbc:mysql://localhost:3306/atg?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
