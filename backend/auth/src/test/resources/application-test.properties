spring.application.name=auth-test

# H2 In-Memory Database (reemplaza MySQL en CI/test)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keycloak (URLs fake — JwtDecoder es lazy, no conecta en startup)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://test.local/fake-certs
keycloak.issuer-uri=http://test.local/keycloak/realms/atg
keycloak.internal-url=http://test.local
keycloak.realm=atg
keycloak.admin.username=admin
keycloak.admin.password=test
keycloak.developer.username=admin

# Email deshabilitado en tests
app.email.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
app.developer.email=test@test.local

# Logging reducido
logging.level.com.manuhd.app.auth=WARN
logging.level.org.springframework=WARN
